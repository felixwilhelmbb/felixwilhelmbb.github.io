<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Felix Wilhelm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #030307;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── three spinning conic layers ── */
    .bg1, .bg2, .bg3 {
      position: fixed; inset: -20%;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 2.5s ease;
      pointer-events: none;
      will-change: transform, filter;
    }

    /* layer 1 — deep navy / steel blue — slow spin */
    .bg1.on {
      opacity: 0.18;
      background: conic-gradient(from 0deg at 35% 45%,
        #0f2a5e 0deg, #1e4d8c 80deg, #0e7490 160deg,
        #1e3a5f 240deg, #0f2a5e 360deg);
      filter: blur(60px) saturate(1.3);
      animation: spin1 25s linear infinite, hue1 18s ease-in-out infinite;
    }

    /* layer 2 — indigo / slate blue — counter-spin */
    .bg2.on {
      opacity: 0.12;
      background: conic-gradient(from 180deg at 65% 55%,
        #1e3a8a 0deg, #1e4d8c 80deg, #0e7490 160deg,
        #0f2a5e 240deg, #1e3a8a 360deg);
      filter: blur(72px) saturate(1.2);
      animation: spin2 34s linear infinite reverse, hue2 22s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    /* layer 3 — cool teal accent — drifts gently */
    .bg3.on {
      opacity: 0.10;
      background: conic-gradient(from 90deg at 50% 30%,
        #0e7490 0deg, #1e4d8c 120deg, #1e3a8a 240deg, #0e7490 360deg);
      filter: blur(80px) saturate(1.1);
      animation: spin3 42s linear infinite, hue3 28s ease-in-out infinite, wander 24s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    @keyframes spin1 {
      from { transform: rotate(0deg) scale(1.15); }
      to   { transform: rotate(360deg) scale(1.15); }
    }
    @keyframes spin2 {
      from { transform: rotate(0deg) scale(1.2); }
      to   { transform: rotate(360deg) scale(1.2); }
    }
    @keyframes spin3 {
      from { transform: rotate(0deg) scale(1.1) translate(0%, 0%); }
      to   { transform: rotate(360deg) scale(1.1) translate(0%, 0%); }
    }

    /* hue-rotate breathing — makes colors shift over time */
    @keyframes hue1 {
      0%,100% { filter: blur(60px) saturate(1.3) hue-rotate(0deg); }
      50%      { filter: blur(60px) saturate(1.5) hue-rotate(15deg); }
    }
    @keyframes hue2 {
      0%,100% { filter: blur(72px) saturate(1.2) hue-rotate(0deg); }
      50%      { filter: blur(72px) saturate(1.4) hue-rotate(-10deg); }
    }
    @keyframes hue3 {
      0%,100% { filter: blur(80px) saturate(1.1) hue-rotate(0deg); }
      33%      { filter: blur(80px) saturate(1.3) hue-rotate(12deg); }
      66%      { filter: blur(80px) saturate(1.1) hue-rotate(-8deg); }
    }

    /* wander — layer 3 drifts across while spinning */
    @keyframes wander {
      0%,100% { margin-left: 0%;    margin-top: 0%;  }
      25%      { margin-left: 8%;   margin-top: -5%; }
      50%      { margin-left: -6%;  margin-top: 6%;  }
      75%      { margin-left: 5%;   margin-top: 4%;  }
    }

    /* pulsing ring — breathes faster than before */
    .pulse {
      position: fixed;
      width: 60vmax; height: 60vmax;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      border-radius: 50%;
      background: radial-gradient(circle,
        transparent 38%,
        rgba(34,211,238,0.07) 58%,
        rgba(109,40,217,0.05) 72%,
        transparent 82%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.5s ease;
    }
    .pulse.on {
      opacity: 0.7;
      animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,100% { transform: translate(-50%, -50%) scale(0.82); }
      50%      { transform: translate(-50%, -50%) scale(1.18); }
    }

    /* second smaller pulse — offset phase */
    .pulse2 {
      position: fixed;
      width: 38vmax; height: 38vmax;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(1);
      border-radius: 50%;
      background: radial-gradient(circle,
        transparent 30%,
        rgba(251,191,36,0.06) 55%,
        transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.5s ease 0.3s;
    }
    .pulse2.on {
      opacity: 1;
      animation: breathe2 5.5s ease-in-out infinite 1s;
    }
    @keyframes breathe2 {
      0%,100% { transform: translate(-50%, -50%) scale(0.9); }
      50%      { transform: translate(-50%, -50%) scale(1.12); }
    }

    /* strong centre vignette */
    .mask {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 70% 70% at 50% 50%,
        rgba(3,3,7,0.92) 0%,
        rgba(3,3,7,0.70) 40%,
        rgba(3,3,7,0.20) 70%,
        rgba(3,3,7,0.00) 100%);
    }

    /* subtle grid */
    .grid {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0;
      transition: opacity 3s ease;
      background-image:
        linear-gradient(rgba(255,255,255,1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px);
      background-size: 90px 90px;
    }
    .grid.on { opacity: 0.025; }

    /* ── content ── */
    .content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .name-wrap {
      margin-bottom: 3rem;
      opacity: 0; animation: up 1.6s cubic-bezier(.22,1,.36,1) forwards 0.4s;
      transform-style: preserve-3d; perspective: 800px;
    }
    .name {
      font-size: clamp(2.2rem, 10vw, 8rem);
      font-weight: 100;
      letter-spacing: clamp(0.1em, 1.8vw, 0.3em);
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
      line-height: 1.1;
      transition: transform 0.1s ease-out;
    }

    .buttons {
      display: flex; gap: 0.85rem; flex-wrap: wrap; justify-content: center;
      margin-bottom: 2.5rem;
      opacity: 0; animation: up 1.6s cubic-bezier(.22,1,.36,1) forwards 0.8s;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.95rem 2.2rem;
      border: 1px solid rgba(255,255,255,0.28);
      color: rgba(255,255,255,0.88);
      text-decoration: none;
      font-size: 0.7rem; font-weight: 200;
      letter-spacing: 0.22em; text-transform: uppercase;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
      touch-action: manipulation;
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg,
        rgba(34,211,238,0) 0%, rgba(34,211,238,0.06) 50%, rgba(251,191,36,0) 100%);
      opacity: 0; transition: opacity 0.3s;
    }
    .btn:hover::after, .btn:active::after { opacity: 1; }
    .btn:hover, .btn:active {
      background: rgba(255,255,255,0.07);
      border-color: rgba(34,211,238,0.3);
      color: #fff;
    }
    .btn svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; position: relative; z-index: 1; }
    .btn span { position: relative; z-index: 1; }

    .line {
      width: 1px; height: 44px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.12), transparent);
      margin-bottom: 1.2rem;
      opacity: 0; animation: up 1.6s cubic-bezier(.22,1,.36,1) forwards 1s;
    }
    .phone {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 0.72rem; font-weight: 200; letter-spacing: 0.15em;
      color: rgba(255,255,255,0.55); text-decoration: none;
      opacity: 0; animation: up 1.6s cubic-bezier(.22,1,.36,1) forwards 1.2s;
      transition: color 0.2s;
      touch-action: manipulation;
      /* big tap target without changing visual size */
      padding: 0.9rem 1.2rem;
      margin: -0.9rem -1.2rem;
    }
    .phone:hover, .phone:active { color: rgba(255,255,255,0.9); }
    .phone svg { width: 11px; height: 11px; fill: currentColor; flex-shrink: 0; opacity: 0.7; }

    @keyframes up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* impressum */
    .imp {
      position: fixed; bottom: 1.2rem; right: 1.4rem; z-index: 6;
      font-size: 0.58rem; font-weight: 200; letter-spacing: 0.1em;
      color: rgba(255,255,255,0.12); background: none; border: none;
      font-family: inherit; cursor: pointer; transition: color 0.2s;
      padding: 0.6rem; touch-action: manipulation;
    }
    .imp:hover { color: rgba(255,255,255,0.42); }
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.88); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .overlay.on { display: flex; }
    .modal {
      background: rgba(3,3,7,0.97); border: 1px solid rgba(255,255,255,0.07);
      padding: 2.2rem 2.5rem; max-width: 420px; width: 100%; position: relative;
    }
    .modal h2 {
      font-size: 0.62rem; font-weight: 300; letter-spacing: 0.28em;
      text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 1.4rem;
    }
    .modal p { font-size: 0.76rem; font-weight: 200; line-height: 1.9; color: rgba(255,255,255,0.5); }
    .mclose {
      position: absolute; top: 0.8rem; right: 1rem;
      background: none; border: none; color: rgba(255,255,255,0.25);
      font-size: 1.3rem; cursor: pointer; font-family: inherit; transition: color 0.2s;
      padding: 0.5rem; touch-action: manipulation;
    }
    .mclose:hover { color: rgba(255,255,255,0.75); }

    @media (max-width: 520px) {
      .buttons { flex-direction: column; width: 100%; max-width: 300px; }
      .btn { padding: 1rem 1.5rem; width: 100%; }
      .grid { display: none; }
      .pulse2 { display: none; }
      .modal { padding: 2rem 1.6rem; }
    }

    /* ── contact floating button ── */
    .contact-fab {
      position: fixed; bottom: 1.2rem; left: 1.4rem; z-index: 6;
      background: none; border: none; font-family: inherit;
      cursor: pointer; padding: 0.6rem; touch-action: manipulation;
      color: rgba(255,255,255,0.12); transition: color 0.2s;
      font-size: 0.58rem; font-weight: 200; letter-spacing: 0.1em;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .contact-fab:hover { color: rgba(255,255,255,0.42); }
    .contact-fab svg { width: 11px; height: 11px; fill: currentColor; }

    /* ── slide-up contact panel ── */
    .contact-panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: rgba(3,3,7,0.97);
      border-top: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      padding: 2rem 2rem 2.5rem;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(.22,1,.36,1);
      max-height: 90vh; overflow-y: auto;
    }
    .contact-panel.open { transform: translateY(0); }

    .cp-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.6rem;
    }
    .cp-header h2 {
      font-size: 0.62rem; font-weight: 300; letter-spacing: 0.28em;
      text-transform: uppercase; color: rgba(255,255,255,0.3);
    }
    .cp-close {
      background: none; border: none; color: rgba(255,255,255,0.25);
      font-size: 1.3rem; cursor: pointer; font-family: inherit;
      transition: color 0.2s; padding: 0.4rem; touch-action: manipulation;
    }
    .cp-close:hover { color: rgba(255,255,255,0.75); }

    .cp-form {
      display: grid; gap: 1rem;
      max-width: 460px; margin: 0 auto;
    }
    .cp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 520px) { .cp-row { grid-template-columns: 1fr; } }

    .cp-field {
      display: flex; flex-direction: column; gap: 0.35rem;
    }
    .cp-field label {
      font-size: 0.58rem; font-weight: 200; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(255,255,255,0.28);
    }
    .cp-field input, .cp-field textarea {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      font-family: 'Inter', sans-serif; font-size: 0.76rem; font-weight: 200;
      padding: 0.7rem 0.9rem; outline: none;
      transition: border-color 0.2s;
      resize: none;
    }
    .cp-field input:focus, .cp-field textarea:focus {
      border-color: rgba(34,211,238,0.35);
    }
    .cp-field textarea { min-height: 90px; }

    .cp-honey { display: none; }

    .cp-submit {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.95rem 2.2rem; border: 1px solid rgba(255,255,255,0.28);
      color: rgba(255,255,255,0.88); background: rgba(0,0,0,0.35);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 200;
      letter-spacing: 0.22em; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s, border-color 0.3s;
      width: 100%; margin-top: 0.4rem;
    }
    .cp-submit:hover { background: rgba(255,255,255,0.07); border-color: rgba(34,211,238,0.3); }
    .cp-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .cp-msg {
      font-size: 0.7rem; font-weight: 200; letter-spacing: 0.1em;
      text-align: center; padding: 0.6rem 0; display: none;
    }
    .cp-msg.ok { color: rgba(16,185,129,0.85); display: block; }
    .cp-msg.err { color: rgba(239,68,68,0.85); display: block; }
  </style>
</head>
<body>

<div class="bg1"    id="bg1"></div>
<div class="bg2"    id="bg2"></div>
<div class="bg3"    id="bg3"></div>
<div class="pulse"  id="pulse"></div>
<div class="pulse2" id="pulse2"></div>
<div class="grid"   id="grid"></div>
<div class="mask"></div>

<div class="content">
  <div class="name-wrap" id="nameWrap">
    <div class="name">Felix Wilhelm</div>
  </div>
  <div class="buttons">
    <a class="btn" href="https://www.linkedin.com/in/felix-wilhelm-8102aba0/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M20.447 20.452H16.89v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a1.979 1.979 0 1 1 0-3.958 1.979 1.979 0 0 1 0 3.958zm1.707 13.019H3.63V9h3.414v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      <span>LinkedIn</span>
    </a>
    <a class="btn" href="https://calendly.com/felixwilhelm/neues-meeting?month=2026-05" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
      <span>Book a Call</span>
    </a>
  </div>
  <div class="line"></div>
  <a class="phone" href="tel:+4917695422094">
    <svg class="phone-icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
    +49 176 95422094
  </a>
</div>

<button class="contact-fab" onclick="document.getElementById('contactPanel').classList.add('open')">
  <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
  Contact
</button>

<div class="contact-panel" id="contactPanel">
  <div class="cp-header">
    <h2>Get in Touch</h2>
    <button class="cp-close" onclick="document.getElementById('contactPanel').classList.remove('open')">&times;</button>
  </div>
  <form class="cp-form" id="contactForm">
    <div class="cp-row">
      <div class="cp-field">
        <label>Name</label>
        <input type="text" name="name" required placeholder="Your name" autocomplete="name" />
      </div>
      <div class="cp-field">
        <label>Email</label>
        <input type="email" name="email" required placeholder="your@email.com" autocomplete="email" />
      </div>
    </div>
    <div class="cp-field">
      <label>Message</label>
      <textarea name="message" required placeholder="How can I help you?"></textarea>
    </div>
    <input class="cp-honey" type="text" name="_gotcha" tabindex="-1" autocomplete="off" />
    <button class="cp-submit" type="submit" id="cpBtn">Send Message</button>
    <div class="cp-msg" id="cpMsg"></div>
  </form>
</div>

<button class="imp" onclick="document.getElementById('imp').classList.add('on')">Impressum</button>
<div class="overlay" id="imp" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="modal">
    <button class="mclose" onclick="document.getElementById('imp').classList.remove('on')">&times;</button>
    <h2>Impressum</h2>
    <p>Felix Wilhelm<br>Weingärtenstr. 15<br>74934 Reichartshausen<br>Deutschland<br><br>
    Branche: Unternehmens- und Personalberatung<br><br>
    Tel: <a href="tel:+4917695422094" style="color:inherit">+49 176 95422094</a><br>
    E-Mail: <a href="mailto:info@wilhelm-buero.de" style="color:inherit">info@wilhelm-buero.de</a></p>
  </div>
</div>

<script>
  setTimeout(() => {
    ['bg1','bg2','bg3','pulse','pulse2','grid'].forEach(id =>
      document.getElementById(id).classList.add('on')
    );
  }, 3500);

  // contact form — Formspree AJAX submit
  document.getElementById('contactForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('cpBtn');
    const msg = document.getElementById('cpMsg');
    msg.className = 'cp-msg';
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      const res = await fetch('https://formspree.io/f/mwvzaoag', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(this)
      });
      if (res.ok) {
        msg.textContent = 'Message sent — I\'ll be in touch shortly.';
        msg.className = 'cp-msg ok';
        this.reset();
        btn.textContent = 'Send Message';
      } else {
        throw new Error();
      }
    } catch {
      msg.textContent = 'Something went wrong. Please try again.';
      msg.className = 'cp-msg err';
      btn.textContent = 'Send Message';
    }
    btn.disabled = false;
  });

  const wrap = document.getElementById('nameWrap');
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let tx = 0, ty = 0, cx = 0, cy = 0;
    document.addEventListener('mousemove', e => {
      tx = (e.clientX / window.innerWidth  - 0.5) * 10;
      ty = (e.clientY / window.innerHeight - 0.5) * 6;
    });
    (function tick() {
      cx += (tx - cx) * 0.05;
      cy += (ty - cy) * 0.05;
      wrap.style.transform = `rotateY(${cx}deg) rotateX(${-cy}deg)`;
      requestAnimationFrame(tick);
    })();
  }
</script>
</body>
</html>
